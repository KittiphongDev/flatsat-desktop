name: flatsat_dashboard
description: FlatSat Ground Station Dashboard - Aerospace-grade mission control interface.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  google_fonts: ^8.2.0
  fl_chart: ^1.2.0
  provider: ^6.1.2
  intl: ^0.20.3
  # Frameless window + custom title bar on Windows/Linux/macOS.
  window_manager: ^0.5.2
  # Persists user settings (camera mode, auto-power) across restarts.
  shared_preferences: ^2.3.2
  # Folder picker for the image save location (F2).
  file_picker: ^8.1.2
  # Default save folder (Documents) + "show in folder" support.
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: "launcher_icon"
  ios: true
  # Windows was missing before, so the .exe kept the default Flutter icon.
  # This writes windows/runner/resources/app_icon.ico, which Runner.rc embeds.
  # icon_size max is 256.
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  # No "linux:" key here on purpose — flutter_launcher_icons does not support
  # Linux (fluttercommunity/flutter_launcher_icons#666), and an unknown key is
  # silently ignored. Linux is handled two other ways:
  #   1. the GTK window icon, set in linux/runner/my_application.cc
  #   2. the menu entry, installed by ../install_linux_icon.sh